<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reclaim — iPhone mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050505; --ink:#f5f1e6; --mute:#8f8a7d; --line:rgba(255,215,110,.14);
    --gold:linear-gradient(135deg,#fff1b0 0%,#f7d774 22%,#f0b90b 55%,#b97800 100%);
    --goldText:linear-gradient(120deg,#fff3c4 0%,#f7d774 35%,#f0b90b 70%,#d49a00 100%);
    --card:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));
    --ok:#7ee0a1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Montserrat,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#2a2005 0%,#0b0a06 45%,#040404 100%);color:var(--ink);min-height:100vh;padding:56px 16px 80px}
  header.page{text-align:center;margin-bottom:48px}
  header.page .k{letter-spacing:.42em;font-size:11px;color:#c9a84a;font-weight:600}
  header.page h1{font-size:34px;font-weight:800;margin-top:10px;background:var(--goldText);-webkit-background-clip:text;background-clip:text;color:transparent}
  header.page p{color:var(--mute);font-size:14px;margin-top:8px}
  .row{display:flex;gap:56px;justify-content:center;flex-wrap:wrap}
  figure{display:flex;flex-direction:column;align-items:center;gap:18px}
  figcaption{font-size:12px;letter-spacing:.2em;color:#c9a84a;font-weight:600;text-transform:uppercase}

  /* iPhone 16 Pro: 402 x 874 pt, thin titanium bezel */
  .phone{width:402px;height:874px;border-radius:62px;padding:11px;position:relative;
    background:linear-gradient(145deg,#5b5852,#2a2926 30%,#46443f 55%,#1d1c1a 80%,#4c4a45);
    box-shadow:0 0 0 1.5px #0d0d0c inset,0 40px 90px rgba(0,0,0,.7),0 0 120px rgba(240,185,11,.08)}
  .phone:before{content:"";position:absolute;right:-3px;top:210px;width:3px;height:96px;border-radius:2px;background:#3a3934}
  .phone:after{content:"";position:absolute;left:-3px;top:180px;width:3px;height:60px;border-radius:2px;background:#3a3934;box-shadow:0 80px 0 #3a3934,0 150px 0 #3a3934}
  .screen{width:100%;height:100%;border-radius:52px;overflow:hidden;position:relative;background:
     radial-gradient(420px 300px at 85% -5%,rgba(240,185,11,.22),transparent 60%),
     radial-gradient(300px 260px at -10% 105%,rgba(240,185,11,.10),transparent 60%),#070707;
    display:flex;flex-direction:column}
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:5}
  .status{height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 40px;font-size:15px;font-weight:600}
  .status .ic{display:flex;gap:6px;align-items:center}
  .content{flex:1;padding:8px 22px 0;display:flex;flex-direction:column;gap:14px;overflow:hidden}
  .home{height:34px;display:flex;justify-content:center;align-items:center}
  .home i{width:136px;height:5px;border-radius:3px;background:rgba(255,255,255,.85)}

  .brand{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.24em;font-size:13px}
  .mark{width:28px;height:28px;border-radius:9px;background:var(--gold);display:grid;place-items:center;color:#1a1200;font-weight:800;font-size:15px;letter-spacing:0;box-shadow:0 4px 18px rgba(240,185,11,.35)}
  .chip{font-size:10px;font-weight:600;letter-spacing:.12em;padding:6px 10px;border-radius:99px;border:1px solid var(--line);color:#e8c766;background:rgba(240,185,11,.06)}
  h2{font-size:30px;line-height:1.08;font-weight:800;letter-spacing:-.02em}
  .g{background:var(--goldText);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--mute);font-size:13.5px;line-height:1.5}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;backdrop-filter:blur(10px)}
  .btn{height:56px;border-radius:18px;background:var(--gold);color:#140e00;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 30px rgba(240,185,11,.28),inset 0 1px 0 rgba(255,255,255,.5)}
  .ghost{height:50px;border-radius:16px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;color:#e8c766}
  .label{font-size:10.5px;letter-spacing:.18em;color:var(--mute);font-weight:600;text-transform:uppercase}
  .mono{font-variant-numeric:tabular-nums}

  /* screen 1 */
  .scan{height:300px;border-radius:26px;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#141210,#0b0a09);border:1px solid var(--line);display:grid;place-items:center}
  .receipt{width:170px;height:228px;background:linear-gradient(180deg,#f4efe2,#e7dfcc);border-radius:6px;transform:rotate(-4deg);padding:14px 12px;color:#3a3427;font-size:7.5px;line-height:1.7;box-shadow:0 20px 40px rgba(0,0,0,.6)}
  .receipt b{display:block;font-size:9px;letter-spacing:.06em}
  .receipt .ln{height:4px;background:#cfc5ad;border-radius:2px;margin:5px 0}
  .corner{position:absolute;width:34px;height:34px;border:3px solid #f0b90b;border-radius:4px}
  .c1{top:22px;left:58px;border-right:0;border-bottom:0;border-top-left-radius:14px}
  .c2{top:22px;right:58px;border-left:0;border-bottom:0;border-top-right-radius:14px}
  .c3{bottom:22px;left:58px;border-right:0;border-top:0;border-bottom-left-radius:14px}
  .c4{bottom:22px;right:58px;border-left:0;border-top:0;border-bottom-right-radius:14px}
  .beam{position:absolute;left:40px;right:40px;top:46%;height:2px;background:linear-gradient(90deg,transparent,#f7d774,transparent);box-shadow:0 0 18px 4px rgba(240,185,11,.45)}
  .pills{display:flex;gap:8px}
  .pill{flex:1;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.02)}
  .pill .v{font-weight:700;font-size:15px;margin-top:3px}

  /* screen 2 */
  .store{display:flex;justify-content:space-between;align-items:flex-start}
  .store .n{font-weight:700;font-size:15px}
  .store .t{font-size:11.5px;color:var(--mute);margin-top:3px}
  .amt{font-weight:800;font-size:18px}
  .checks{display:grid;gap:9px;margin-top:2px}
  .ck{display:flex;align-items:center;gap:10px;font-size:13px}
  .ck .d{width:20px;height:20px;border-radius:7px;background:rgba(126,224,161,.12);border:1px solid rgba(126,224,161,.35);display:grid;place-items:center;color:var(--ok);font-size:11px;font-weight:800;flex:none}
  .ck span.r{margin-left:auto;color:var(--mute);font-size:11.5px}
  .offer{border-radius:24px;padding:18px;background:
     linear-gradient(160deg,rgba(247,215,116,.16),rgba(240,185,11,.04) 60%),#0d0b06;border:1px solid rgba(247,215,116,.35);position:relative;overflow:hidden}
  .offer:after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(247,215,116,.25),transparent 70%)}
  .big{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .split{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:12px}
  .split b{color:var(--ink);font-weight:600}
  .oracle{display:flex;align-items:center;gap:6px;font-size:11px;color:#e8c766;margin-top:10px}
  .dot{width:6px;height:6px;border-radius:50%;background:#f0b90b;box-shadow:0 0 8px #f0b90b}

  /* screen 3 */
  .success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-top:6px}
  .ring{width:74px;height:74px;border-radius:50%;background:var(--gold);display:grid;place-items:center;box-shadow:0 0 0 8px rgba(240,185,11,.1),0 0 50px rgba(240,185,11,.4)}
  .ring svg{width:34px;height:34px}
  .nft{border-radius:22px;padding:16px;position:relative;overflow:hidden;background:
     linear-gradient(135deg,#1c1607 0%,#0b0905 50%,#1a1406 100%);border:1px solid rgba(247,215,116,.3)}
  .nft .hdr{display:flex;justify-content:space-between;align-items:center}
  .nft .id{font-size:24px;font-weight:800}
  .nft .sheen{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,236,170,.10) 50%,transparent 65%)}
  .tl{display:grid;gap:0}
  .st{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:13px}
  .st:not(:last-child):before{content:"";position:absolute;left:9px;top:20px;bottom:0;width:2px;background:rgba(240,185,11,.25)}
  .st .b{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10px;font-weight:800}
  .st.done .b{background:var(--gold);color:#140e00}
  .st.next .b{border:2px solid #f0b90b;background:#0a0a0a}
  .st.todo .b{border:2px solid #3a3730;background:#0a0a0a}
  .st .tt{font-size:13px;font-weight:600}
  .st .ds{font-size:11.5px;color:var(--mute);margin-top:2px}
  .st.todo .tt{color:#77736a}
  footer{text-align:center;color:#6f6a5e;font-size:12px;margin-top:44px}
</style>
</head>
<body>
<header class="page">
  <div class="k">BNB BANGKOK 2026 · DEVELOPER TRACK</div>
  <h1>Reclaim</h1>
  <p>Your Thai VAT refund, advanced today. iPhone 16 Pro concept.</p>
</header>

<div class="row">

<!-- ============ SCREEN 1: SCAN ============ -->
<figure>
<div class="phone"><div class="screen">
  <div class="island"></div>
  <div class="status"><span>9:41</span><span class="ic">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#fff"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff"/></svg>

    <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" opacity=".45"/><rect x="2" y="2" width="18" height="9" rx="2" fill="#fff"/><rect x="24.5" y="4.5" width="1.6" height="4" rx=".8" fill="#fff" opacity=".45"/></svg>

    <div class="brand"><div class="logo"><div class="mark">R</div>RECLAIM</div><div class="chip">BNB CHAIN</div></div>
    <h2>Your VAT refund,<br><span class="g">today.</span></h2>
    <p class="sub">Scan your tax invoice. Our AI agent checks it and pays you up to 80% of your refund in seconds.</p>

      <div class="pill"><div class="label">Advance</div><div class="v g">80%</div></div>
      <div class="pill"><div class="label">Fee</div><div class="v">5%</div></div>
      <div class="pill"><div class="label">Payout</div><div class="v">~10s</div></div>
    </div>
  </div>
  <div class="home"><i></i></div>
</div></div>
<figcaption>01 · Scan</figcaption>
</figure>

<!-- ============ SCREEN 2: VERIFY + OFFER ============ -->
<figure>
<div class="phone"><div class="screen">
  <div class="island"></div>
  <div class="status"><span>9:41</span><span class="ic">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#fff"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" opacity=".45"/><rect x="2" y="2" width="18" height="9" rx="2" fill="#fff"/></svg>
  </span></div>
  <div class="content">
    <div class="brand"><div class="logo" style="letter-spacing:0;font-size:15px;font-weight:700">‹&nbsp; Agent check</div><div class="chip">6 / 6 PASSED</div></div>
    <div class="card">
      <div class="store"><div><div class="n">Siam Paragon</div><div class="t">Receipt PM-000127 · 22 Nov 2026</div></div>
      <div style="text-align:right"><div class="amt mono">฿127,000</div><div class="t" style="font-size:11.5px;color:var(--mute)">VAT ฿8,308.41</div></div></div>
    </div>
    <div class="card checks">
      <div class="ck"><div class="d">✓</div>VAT-registered seller<span class="r">13-digit ID</span></div>
      <div class="ck"><div class="d">✓</div>Above ฿2,000 minimum</div>
      <div class="ck"><div class="d">✓</div>VAT matches 7%</div>
      <div class="ck"><div class="d">✓</div>Within 60-day window<span class="r">57 days left</span></div>
      <div class="ck"><div class="d">✓</div>P.P.10 form issued</div>
      <div class="ck"><div class="d">✓</div>Never advanced before<span class="r">on-chain</span></div>
    </div>
    <div class="offer">
      <div class="label" style="color:#e8c766">Available now</div>
      <div class="big g mono" style="margin-top:8px">$165.55</div>
      <div class="split"><span>Est. refund <b class="mono">$206.94</b></span><span>Fee <b class="mono">$10.35</b></span><span>Due <b>Jan 21</b></span></div>
      <div class="oracle"><i class="dot"></i>THB/USD 0.02930 · Atlas Oracle</div>
    </div>

  </div>
  <div class="home"><i></i></div>
</div></div>
<figcaption>02 · Verify &amp; offer</figcaption>
</figure>

<!-- ============ SCREEN 3: PAID ============ -->
<figure>
<div class="phone"><div class="screen">
  <div class="island"></div>
  <div class="status"><span>9:41</span><span class="ic">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#fff"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" opacity=".45"/><rect x="2" y="2" width="18" height="9" rx="2" fill="#fff"/></svg>
  </span></div>
  <div class="content">
    <div class="success">
      <div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="#140e00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7.5"/></svg></div>
      <div class="label" style="margin-top:8px">Sent to your wallet</div>
      <div class="big g mono">$165.55</div>
      <div class="sub" style="font-size:12.5px">Settled on BNB Chain in 3 seconds</div>

      <div class="sheen"></div>

      <div class="split" style="margin-top:8px"><span>Refund right <b class="mono">$206.94</b></span><span>Repay <b class="mono">$175.90</b></span></div>
    </div>
    <div class="card tl">
      <div class="st done"><div class="b">✓</div><div><div class="tt">Receipt verified by AI agent</div></div></div>
      <div class="st done"><div class="b">✓</div><div><div class="tt">Claim tokenized &amp; paid</div><div class="ds">0x9943…0730 · BscScan</div></div></div>
      <div class="st next"><div class="b"></div><div><div class="tt">Collect refund at the airport</div><div class="ds">Before Jan 21, 2027</div></div></div>
      <div class="st todo"><div class="b"></div><div><div class="tt">Repay $175.90 · claim settled</div></div></div>
    </div>
    <div class="ghost">View on BscScan ↗</div>
  </div>
  <div class="home"><i></i></div>
</div></div>
<figcaption>03 · Paid</figcaption>
</figure>

</div>
<footer>Testnet prototype · amounts from the live BSC testnet run (claim #1) · No token is issued · Not financial advice</footer>
</body>
</html>
